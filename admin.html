<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Pemesanan Pempek</title>
<script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
  <h1>📦 Daftar Pesanan</h1>
  <table border="1" id="data-table">
    <thead>
      <tr>
        <th>Tanggal</th><th>Nama</th><th>No WA</th><th>Alamat</th><th>Metode</th><th>Pesanan</th><th>Jumlah</th><th>Total</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
  const SHEET_ID = "1q3pBsmFtwxxarPrRXSAidM_WgOVahxzHakKvQJnihUk";
  const API_KEY = "AIzaSyCBsNf0WIeeYUDJWrIqrXQCY1iXEfV8jhc";

  async function loadData() {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Sheet1?key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    const rows = data.values.slice(1);
    const tbody = document.querySelector("#data-table tbody");
    tbody.innerHTML = rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
  }
  loadData();
  </script>
</body>
</html>
